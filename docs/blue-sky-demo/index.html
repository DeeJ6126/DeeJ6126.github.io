<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE SKY — Motion Graphics</title>
<style>
/* ============================================================
   BLUE SKY · 还原自 AeRAIR SUMMER 动效视频
   视觉语言：米白噪点纸感 / 蓝色系多明度渐变像素方块 /
            空心线框矩形 / 嵌套隧道 / 荧光黄绿点缀
   ============================================================ */
:root {
  --paper: #ebe6e8;          /* 米白纸底 */
  --paper-deep: #e2dcdd;
  --ink: #0d1b2a;            /* 深墨蓝（近黑） */
  --blue-deep: #14336e;
  --blue: #1e5fd9;
  --blue-mid: #3d8bf5;
  --blue-light: #7ec8f2;
  --blue-pale: #c3e2f7;
  --neon: #c9f73a;           /* 荧光黄绿（BLUE/SKY 大字） */
  --pixel: 12px;             /* 像素单元 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  font-family: 'Montserrat', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ---------- 噪点覆盖层（feTurbulence 纸感） ---------- */
.noise {
  position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
}
.noise svg { width: 100%; height: 100%; }

/* ---------- 飞鸟粒子 Canvas（最底层之上） ---------- */
#particles { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

/* ---------- 场景层 ---------- */
.scene {
  position: fixed; inset: 0; z-index: 10;
  opacity: 0; visibility: hidden; transition: opacity .8s ease;
  display: flex; align-items: center; justify-content: center;
}
.scene.active { opacity: 1; visibility: visible; }

/* ============ 场景 1 · 黑底开口线框 ============ */
#s1 { background: #05070c; }
#s1 .frame {
  position: relative; width: 340px; height: 340px;
}
#s1 .frame::before, #s1 .frame::after { content: ''; position: absolute; background: #dce9f7; }
#s1 .frame::before { left: 0; right: 0; top: 0; height: 2px; }
#s1 .frame::after  { left: 0; right: 0; bottom: 0; height: 2px; }
#s1 .side { position: absolute; top: 0; bottom: 0; width: 2px; background: #dce9f7; }
#s1 .side.l { left: 0; } #s1 .side.r { right: 0; }
/* 下边中缝断开：左右各一段短横 */
#s1 .gap-l, #s1 .gap-r { position: absolute; bottom: 0; width: 120px; height: 2px; background: #dce9f7; }
#s1 .gap-l { left: 0; } #s1 .gap-r { right: 0; }
#s1 .brand { position: fixed; top: 24px; right: 32px; color: rgba(255,255,255,.85); font-size: 13px; letter-spacing: .12em; }

/* ============ 场景 2 · 蓝渐变像素方块群 ============ */
#s2 { background: var(--paper); }
.pixel-block { position: absolute; image-rendering: pixelated; }
#s2 .hero-block {
  width: 260px; height: 320px; left: 50%; top: 50%;
  transform: translate(-50%,-50%);
  background: linear-gradient(180deg, var(--blue-deep) 0%, var(--blue) 45%, var(--blue-light) 100%);
  /* 磨损缺口：用多层阴影切角模拟像素毛边 */
  clip-path: polygon(0 0, 88% 0, 100% 10%, 100% 100%, 0 100%);
  filter: contrast(1.02);
  animation: heroIn 1.4s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes heroIn {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.7) rotate(-3deg); }
  60% { opacity: 1; transform: translate(-50%,-50%) scale(1.04) rotate(0); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
}
/* 半色调点阵纹理 */
#s2 .hero-block::after {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1.6px);
  background-size: 10px 10px; opacity: .4;
}
/* 5 个天空矩形（第4秒形态） */
.sky-row { position: absolute; display: flex; gap: 8px; left: 50%; top: 50%; transform: translate(-50%,-50%); }
.sky-row .sq {
  width: 56px; height: 96px;
  background: linear-gradient(180deg, var(--blue-deep), var(--blue-light));
  image-rendering: pixelated;
}
.sky-row .sq:nth-child(1) { animation: skyIn .6s .1s ease forwards; }
.sky-row .sq:nth-child(2) { animation: skyIn .6s .25s ease forwards; }
.sky-row .sq:nth-child(3) { animation: skyIn .6s .4s ease forwards; }
.sky-row .sq:nth-child(4) { animation: skyIn .6s .55s ease forwards; }
.sky-row .sq:nth-child(5) { animation: skyIn .6s .7s ease forwards; }
@keyframes skyIn { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(24px); } }

/* ============ 场景 4 · 嵌套矩形隧道 + BLUE SKY ============ */
#s4 { background: var(--paper); }
#s4 .tunnel { position: relative; width: 100%; height: 100%; }
.ring {
  position: absolute; left: 50%; top: 50%;
  border: 3px solid var(--blue); border-radius: 2px;
  transform: translate(-50%,-50%) scale(1);
}
#s4 .ring-1 { width: 96%; height: 96%; border-color: var(--blue-deep); animation: ringIn 1s .0s ease forwards; }
#s4 .ring-2 { width: 78%; height: 78%; border-color: var(--blue); animation: ringIn 1s .15s ease forwards; }
#s4 .ring-3 { width: 60%; height: 60%; border-color: var(--blue-mid); animation: ringIn 1s .3s ease forwards; }
#s4 .ring-4 { width: 42%; height: 42%; border-color: var(--blue-light); animation: ringIn 1s .45s ease forwards; }
#s4 .ring-5 { width: 24%; height: 24%; border-color: var(--blue-pale); animation: ringIn 1s .6s ease forwards; }
@keyframes ringIn {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}
.big-word {
  position: absolute; font-weight: 800; letter-spacing: -.02em; line-height: .9;
  color: var(--neon); text-shadow: 0 0 24px rgba(201,247,58,.35);
}
#s4 .w-left  { left: 4%; top: 32%; font-size: clamp(64px, 14vw, 190px); animation: wordIn .9s .8s ease forwards; }
#s4 .w-right { right: 4%; top: 56%; font-size: clamp(64px, 14vw, 190px); animation: wordIn .9s .95s ease forwards; }
@keyframes wordIn { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(30px); } }

/* ============ 场景 5 · 像素展翅飞鸟 + SKY / FLYING ============ */
#s5 { background: var(--paper); }
.pixel-bird {
  position: relative; width: 230px; height: 200px;
  display: grid; grid-template-columns: repeat(23, 10px); grid-template-rows: repeat(20, 10px);
  gap: 0; image-rendering: pixelated;
}
.pixel-bird .px { display: block; width: 100%; height: 100%; }
.pixel-bird .px.on { background: var(--ink); animation: pxPop .35s ease forwards; }
@keyframes pxPop { to { opacity: 1; } from { opacity: 0; } }
/* 展翅鸟形（14×10 像素网格，1=填充） */
#s5 .word-top { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); font-size: clamp(40px, 7vw, 96px); font-weight: 800; letter-spacing: .1em; color: var(--blue-light); }
#s5 .word-bot { position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%); font-size: clamp(40px, 7vw, 96px); font-weight: 800; letter-spacing: .06em; color: var(--blue-mid); opacity: .9; }

/* ============ 场景 6 · 收尾：空心线框 + 淡粉 ============ */
#s6 { background: linear-gradient(135deg, var(--paper) 0%, #f6ecea 55%, #f3e3e4 100%); }
#s6 .end-frame { position: relative; width: 220px; height: 220px; border: 2px solid var(--blue-pale); opacity: .85; }
#s6 .end-frame::before, #s6 .end-frame::after { content: ''; position: absolute; background: var(--blue-pale); }
#s6 .end-frame::before { top: -14px; left: -14px; width: 14px; height: 2px; }
#s6 .end-frame::after  { top: -14px; right: -14px; width: 14px; height: 2px; }

/* ---------- 四角小装饰（贯穿各场景） ---------- */
.corner { position: fixed; z-index: 20; }
.corner .dot { width: 10px; height: 10px; background: var(--blue-mid); }
.corner.tl { top: 20px; left: 20px; display: flex; gap: 6px; }
.corner.tl .dot { opacity: .75; }
.corner.tl .dot:nth-child(3) { background: var(--blue-deep); }
.corner.br { bottom: 20px; right: 20px; width: 40px; height: 10px; background: var(--blue); opacity: .9; }

/* ---------- 状态提示 ---------- */
.hint {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  z-index: 70; font-size: 11px; letter-spacing: .18em; color: rgba(13,27,42,.45);
  text-transform: uppercase;
}
</style>
</head>
<body>

<!-- 噪点覆盖层 -->
<div class="noise" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grain)" opacity="0.55"/>
  </svg>
</div>

<!-- 飞鸟粒子 Canvas -->
<canvas id="particles"></canvas>

<!-- 四角装饰 -->
<div class="corner tl"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="corner br"></div>

<!-- ============ 场景 1：黑底开口线框 ============ -->
<section class="scene" id="s1">
  <div class="frame">
    <span class="side l"></span><span class="side r"></span>
    <span class="gap-l"></span><span class="gap-r"></span>
  </div>
  <div class="brand">AeRaIr_AiLR · SUMMER</div>
</section>

<!-- ============ 场景 2：蓝渐变像素方块群 ============ -->
<section class="scene" id="s2">
  <div class="hero-block"></div>
  <div class="sky-row" id="skyRow">
    <span class="sq"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span><span class="sq"></span>
  </div>
</section>

<!-- ============ 场景 3：飞鸟拖尾（Canvas 粒子，见 JS）============ -->
<section class="scene" id="s3"></section>

<!-- ============ 场景 4：嵌套隧道 + BLUE SKY ============ -->
<section class="scene" id="s4">
  <div class="tunnel">
    <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
    <div class="ring ring-4"></div><div class="ring ring-5"></div>
    <div class="big-word w-left">BLUE</div>
    <div class="big-word w-right">SKY</div>
  </div>
</section>

<!-- ============ 场景 5：像素展翅鸟 ============ -->
<section class="scene" id="s5">
  <div class="word-top">SKY</div>
  <div class="pixel-bird" id="bird"></div>
  <div class="word-bot">FLYING</div>
</section>

<!-- ============ 场景 6：收尾 ============ -->
<section class="scene" id="s6">
  <div class="end-frame"></div>
</section>

<div class="hint">BLUE SKY · motion study</div>

<script>
/* ============================================================
   时间轴编排（约 24s 循环）
   0.0-2.0   s1 黑底开口线框
   2.0-8.0   s2 像素方块登场（含 5 矩形展开）
   8.0-13.0  s3 飞鸟拖尾（Canvas 粒子 + 节点连线）
   13.0-18.5 s4 嵌套隧道 + BLUE SKY
   18.5-22.5 s5 像素展翅鸟 + SKY FLYING
   22.5-24.0 s6 收尾
   ============================================================ */
const TIMELINE = [
  { id: 's1', start: 0.0,  end: 2.0  },
  { id: 's2', start: 2.0,  end: 8.0  },
  { id: 's3', start: 8.0,  end: 13.0 },
  { id: 's4', start: 13.0, end: 18.5 },
  { id: 's5', start: 18.5, end: 22.5 },
  { id: 's6', start: 22.5, end: 24.0 },
];
const LOOP = 24;

let currentScene = null;

function tick(now) {
  // 支持 ?scene=s3 固定场景调试（无参则走时间轴）
  const forced = 's5'; // PREVIEW_SCENE
  const t = (now / 1000) % LOOP;
  let active = null;
  if (forced) { active = forced; }
  else {
    for (const seg of TIMELINE) {
      if (t >= seg.start && t < seg.end) { active = seg.id; break; }
    }
  }
  if (active !== currentScene) {
    document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
    if (active) document.getElementById(active).classList.add('active');
    currentScene = active;
  }
  requestAnimationFrame(tick);
}

/* ============================================================
   像素展翅鸟（14×10 网格）
   ============================================================ */
const BIRD_MAP = [
  '.......................',
  '.................11....',
  '................1111...',
  '................1111...',
  '...............11111...',
  '..............111111...',
  '.11..........1111111...',
  '.11.........11111111...',
  '.111.......111111111...',
  '.1111.....1111111111...',
  '.111111111111111111111.',
  '..1111111111111111111..',
  '...11111111111111111...',
  '....111111111111111....',
  '.....1111111111111.....',
  '......11111111111......',
  '.......111111111.......',
  '........1111111........',
  '.........11111.........',
  '..........111..........',
];
function buildBird() {
  const wrap = document.getElementById('bird');
  const grid = BIRD_MAP.join('');
  let i = 0;
  for (const ch of grid) {
    const px = document.createElement('span');
    px.className = 'px' + (ch === '1' ? ' on' : '');
    if (ch === '1') px.style.animationDelay = (i * 18) + 'ms';
    wrap.appendChild(px);
    i++;
  }
}

/* ============================================================
   飞鸟拖尾粒子系统（s3）
   蓝色方块沿波浪轨迹飞行，拖尾粒子缩小淡出，
   距离小于阈值自动连线（还原视频节点网络）
   ============================================================ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

const BLUES = ['#14336e', '#1e5fd9', '#3d8bf5', '#7ec8f2', '#c3e2f7'];
const LINK_DIST = 130;   // 连线阈值
const PARTICLE_LIFE = 110;

const particles = [];
const mouse = { x: null, y: null, active: false };
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('pointerleave', () => { mouse.active = false; });

// 飞鸟位置：默认波浪路径，鼠标介入时跟随
const bird = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, time: Math.random() * 100 };
const BIRD_SPEED = 3.4;

function target(t) {
  if (mouse.active) return { x: mouse.x, y: mouse.y };
  // 波浪轨迹：x 从右向左扫描，y 正弦起伏 + 屏幕中线
  const x = (W / DPR) - ((t * BIRD_SPEED * 60) % ((W / DPR) + 200)) + 100;
  const y = (H / DPR) / 2 + Math.sin(t * 1.4) * (H / DPR) * 0.22;
  return { x, y };
}

function drawBirdParticle(x, y, size, alpha, color) {
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.fillRect(x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = 1;
}

function frame(now) {
  const t = now / 1000;
  // 仅 s3 激活时运行粒子
  const active = document.getElementById('s3').classList.contains('active');

  ctx.clearRect(0, 0, W / DPR, H / DPR);

  if (!active) { requestAnimationFrame(frame); return; }

  // 飞鸟缓动
  const goal = target(t);
  bird.vx += (goal.x - bird.x) * 0.06;
  bird.vy += (goal.y - bird.y) * 0.06;
  bird.vx *= 0.86; bird.vy *= 0.86;
  bird.x += bird.vx; bird.y += bird.vy;
  bird.angle = Math.atan2(bird.vy, bird.vx);

  // 生成拖尾粒子（方块，随机蓝）
  particles.push({
    x: bird.x, y: bird.y,
    size: 10 + Math.random() * 14,
    life: PARTICLE_LIFE,
    max: PARTICLE_LIFE,
    color: BLUES[(Math.random() * BLUES.length) | 0],
  });
  if (particles.length > 240) particles.shift();

  // 更新粒子：缩小 + 淡出
  for (const p of particles) {
    p.life--;
    p.size *= 0.985;
  }
  while (particles.length && particles[0].life <= 0) particles.shift();

  // 距离连线（近阈值自动连线，透明度随距离衰减）
  ctx.lineWidth = 1;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < LINK_DIST * LINK_DIST) {
        const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.22;
        ctx.strokeStyle = '#3d8bf5';
        ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;

  // 绘制粒子（方块）
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.max) * 0.9;
    drawBirdParticle(p.x, p.y, Math.max(2, p.size), alpha, p.color);
  }

  // 飞鸟本体（小方块鸟：本体 + 两侧翼）
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);
  drawBirdParticle(0, 0, 18, 1, '#14336e');
  drawBirdParticle(-12, 0, 10, 0.9, '#1e5fd9');
  drawBirdParticle(12, 0, 10, 0.9, '#1e5fd9');
  drawBirdParticle(-22, 0, 6, 0.6, '#7ec8f2');
  ctx.restore();

  requestAnimationFrame(frame);
}

/* 启动 */
buildBird();
requestAnimationFrame(tick);
requestAnimationFrame(frame);
</script>
</body>
</html>
